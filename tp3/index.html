<!DOCTYPE html>
<html>
<head>

    <title> Catálogo de Productos</title>
    <!-- Vinculamos los estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Botón de retorno al menú -->
<!-- El enlace debe tener "../index.html" porque está dentro de una subcarpeta -->
<a href="../index.html" class="btn-volver">&larr; Volver al Menú Principal</a>

    <!-- Contenedor Principal del Catálogo (Flexbox con wrap) -->
    <div class="catalogo-container">

        <!-- Producto 1 -->
        <div class="tarjeta-producto">
            <div class="imagen-container">
                <img src="producto1.png" alt="bicicleta">
            </div>
            <h3>bicicleta</h3>
            <p>bicicleta  rodado 29</p>
            <span class="precio">$800.000</span>
            <div class="estrellas">★★★★★</div>
            <button class="btn-comprar">Comprar</button>
        </div>

        <!-- Producto 2 -->
        <div class="tarjeta-producto">
            <div class="imagen-container">
                <img src="producto2.png" alt="iphone  17 pro max">
            </div>
            <h3>celular</h3>
            <p>iphone 17 pro max </p>
            <span class="precio">$1.800.000</span>
            <div class="estrellas">★★★★★</div>
            <button class="btn-comprar">Comprar</button>
        </div>

        <!-- Producto 2 -->
        <div class="tarjeta-producto">
            <div class="imagen-container">
                <img src="producto3.png" alt="zapatillas">
            </div>
            <h3>zapatillas</h3>
            <p>zapatillas adidas blanca </p>
            <span class="precio">$140.000</span>
            <div class="estrellas">★★★★★</div>
            <button class="btn-comprar">Comprar</button>
        </div>




        <!-- Producto 4 -->
        <div class="tarjeta-producto">
            <div class="imagen-container">
                <img src="producto4.png" alt="parlante">
            </div>
            <h3>parlante</h3>
            <p>parlante resistente al agua </p>
            <span class="precio">$59.999</span>
            <div class="estrellas">★★★★★</div>
            <button class="btn-comprar">Comprar</button>
        </div>

    </div>

</body>
</html>
