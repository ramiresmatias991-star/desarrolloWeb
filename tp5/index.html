<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP 5: Landing Page Completa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- El enlace debe tener "../index.html" porque está dentro de una subcarpeta -->
<a href="../index.html" class="btn-volver">&larr; Volver al Menú Principal</a>

    <header class="navbar">
        <div class="logo">FASHION<span class="logo-sub">CATALOGUE</span></div>
        <nav class="nav-links">
            <a href="#">FASHION</a>
            <a href="#">FAVOURITE</a>
            <a href="#">LIFESTYLE</a>
        </nav>
        <a href="#" class="btn-sign">SIGN UP</a>
    </header>

    <main class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">
                LET'S <span class="highlight-box-1">EXPLORE</span> <br>
                <span class="highlight-box-2">UNIQUE</span> <br>
                CLOTHES
            </h1>
            <p class="hero-subtitle">Live for Influential and Innovative fashion!</p>
            <a href="#" class="btn-shop">Shop Now</a>
        </div>

        <div class="hero-image-container">
            <div class="card-decoration">
                <!-- Reemplaza 'tu-foto.jpg' por el nombre de tu imagen guardada en la misma carpeta -->
                <img src="modelo.png" alt="Modelo de ropa" class="hero-img">
            </div>
        </div>
    </main>

    <section class="brands-section">
        <div class="brands-container">
            <span class="brand-item hmo">H&M</span>
            <span class="brand-item obey">OBEY</span>
            <span class="brand-item shopify">shopify</span>
            <span class="brand-item lacoste">LACOSTE</span>
            <span class="brand-item levis">Levi's</span>
            <span class="brand-item amazon">amazon</span>
        </div>
    </section>

</body>
</html>
